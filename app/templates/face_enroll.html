{% extends "base.html" %}
{% block content %}
<div class="wrap narrow">
  <h2>Enroll your face</h2>
  <p>Look straight at the camera in good light. This is stored once and used to verify every future check-in — do it carefully.</p>
  <hr class="chalk-rule" />

  <div class="panel">
    <div class="cam-wrap">
      <video id="video" autoplay muted playsinline></video>
      <div class="cam-ring" id="ring"></div>
    </div>
    <div class="status-line" id="status">Loading face model…</div>
    <div style="margin-top:1.2rem; display:flex; gap:0.8rem;">
      <button class="btn btn-primary full" id="captureBtn" disabled>Capture &amp; save</button>
    </div>
  </div>
</div>

<script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
<script defer src="/static/js/face.js"></script>
<script defer>
  window.addEventListener('DOMContentLoaded', () => {
    RollCallFace.initEnrollPage({
      videoId: 'video',
      ringId: 'ring',
      statusId: 'status',
      buttonId: 'captureBtn',
      saveUrl: '/api/face/enroll',
      onSaved: () => { window.location.href = '/student'; },
    });
  });
</script>
{% endblock %}
