{% extends "base.html" %}
{% block content %}
<div class="wrap narrow">
  <h2>Create your account</h2>
  <p>Teachers open rolls. Students enroll their face once, then check in each class.</p>
  <hr class="chalk-rule" />

  {% if error %}<div class="error-banner">{{ error }}</div>{% endif %}

  <form method="post" action="/register" class="panel">
    <div class="field">
      <label>I am a</label>
      <div class="role-toggle">
        <label><input type="radio" name="role" value="student" checked /><span>Student</span></label>
        <label><input type="radio" name="role" value="teacher" /><span>Teacher</span></label>
      </div>
    </div>
    <div class="field">
      <label for="name">Full name</label>
      <input type="text" id="name" name="name" required autocomplete="name" />
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="email" />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password" />
    </div>
    <button class="btn btn-primary full" type="submit">Create account</button>
  </form>
  <p style="margin-top:1rem;">Already registered? <a href="/login">Log in</a></p>
</div>
{% endblock %}
