<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Roll Call — Attendance{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="topbar">
    <a class="brand" href="/"><span>Roll</span><span class="dot">Call</span></a>
    <nav>
      {% if user %}
        <span class="tag">{{ user.role }}</span>
        <span style="color: var(--chalk-dim); font-size: 0.9rem;">{{ user.name }}</span>
        <a href="/logout">Log out</a>
      {% else %}
        <a href="/login">Log in</a>
        <a href="/register">Register</a>
      {% endif %}
    </nav>
  </div>

  {% block content %}{% endblock %}

  <footer class="foot">Roll Call — geofenced, face-verified attendance.</footer>
</body>
</html>
